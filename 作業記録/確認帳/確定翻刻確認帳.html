<style>
/* 判断帳と同じ帳面。丁ごとにまとめ、確信度「低」を先に、「中」は丁ごとに畳む */
:root{
  --bg:#f3f4f1; --paper:#ffffff; --ink:#1f2a33; --sub:#5b6670; --line:#d9ddd8;
  --ai:#2e4a62; --ai-soft:#e4ebf1; --shu:#b2452d; --shu-soft:#f7e6e1;

  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a1f; --paper:#1c242b; --ink:#e3e8ec; --sub:#9aa6b0; --line:#33404a;
  --ai:#9cc0dd; --ai-soft:#22323f; --shu:#ec8a72; --shu-soft:#3a2420;
  --ok:#8fd0a9; --ok-soft:#1f3529; --hold:#e0c070; --hold-soft:#3a3120; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a1f; --paper:#1c242b; --ink:#e3e8ec; --sub:#9aa6b0; --line:#33404a;
  --ai:#9cc0dd; --ai-soft:#22323f; --shu:#ec8a72; --shu-soft:#3a2420;
  --ok:#8fd0a9; --ok-soft:#1f3529; --hold:#e0c070; --hold-soft:#3a3120; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 80px;display:grid;gap:28px}

p{margin:0}
.lead{color:var(--sub);max-width:62ch}
.status{font-size:.88rem;color:var(--sub)}

a:focus-visible,button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
section.pg{display:grid;gap:12px;scroll-margin-top:16px}
.pg-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;border-bottom:1px solid var(--line);padding-bottom:8px}
.pg-head .sub{color:var(--sub);font-size:.9rem}
.pg-head a{color:var(--ai);font-size:.9rem}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:grid;gap:10px}

.card.gen{border-left:4px solid var(--shu)}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;font-size:.85rem;color:var(--sub)}
.meta .no{font-weight:700;color:var(--ink)}
.chip{font-size:.75rem;padding:1px 8px;border-radius:999px;background:var(--ai-soft);color:var(--ai);letter-spacing:.04em}
.chip.lo{background:var(--shu-soft);color:var(--shu)}
.trio{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:10px}
.trio > div{min-width:0;display:grid;gap:2px;align-content:start}
.lbl{font-size:.75rem;color:var(--sub);letter-spacing:.06em}
.txt{font-family:var(--display);font-size:1.02rem;line-height:1.7;overflow-wrap:anywhere}
.j .txt{color:var(--ai);font-weight:700}
.gtext{font-size:.95rem;overflow-wrap:anywhere}
.why{font-size:.9rem;color:var(--sub)}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices button{font:inherit;font-size:.88rem;padding:5px 12px;border-radius:4px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.choices button[aria-pressed="true"][data-k="ok"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.choices button[aria-pressed="true"][data-k="a"],.choices button[aria-pressed="true"][data-k="b"],.choices button[aria-pressed="true"][data-k="x"]{background:var(--ai-soft);border-color:var(--ai);color:var(--ai);font-weight:700}

.choices button:disabled{opacity:.5;cursor:default}
textarea{font:inherit;font-size:.92rem;width:100%;box-sizing:border-box;min-height:2.4em;padding:6px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);resize:vertical}
details.mid > summary{cursor:pointer;color:var(--ai);font-size:.95rem}

.bulk{font:inherit;font-size:.85rem;padding:4px 12px;border-radius:4px;border:1px solid var(--ok);background:var(--ok-soft);color:var(--ok);cursor:pointer}
.bulk:disabled{opacity:.5;cursor:default}
.empty{font-size:.9rem;color:var(--sub)}
@media (max-width:600px){.trio{grid-template-columns:1fr 1fr}.trio .j{grid-column:1 / -1}h1{font-size:1.55rem}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<div class="wrap">
  <header style="display:grid;gap:10px">
    <p class="status" style="letter-spacing:.08em">豐中常文庫 ／ 塾主の確認用</p>
    <h1>確定翻刻 確認帳</h1>
    <p class="lead">倭姫命世記の全45丁を二人が別々に翻刻し、食い違った字を画像で確かめて確定翻刻を作りました。そのうち確信度が「低」と「中」の判定と、全体にかかる方針をまとめています。「判定でよい」か、A・Bのどちらか、別の読みかを選んでください。選んだ内容はその場で保存され、Claude が確定翻刻に反映します。</p>
    <p class="status" id="dbstatus">保存先に接続しています…</p>
  </header>

  <div class="progress" aria-live="polite">
    <div class="counts" id="counts"></div>
    <div class="bar"><i id="bar"></i></div>
  </div>

  <div class="filter">
    <label><input type="checkbox" id="onlyOpen"> まだ選んでいないものだけ</label>
    <label><input type="checkbox" id="openMid"> 確信度「中」をすべて開く</label>
  </div>
  <nav class="toc" aria-label="丁の目次" id="toc"></nav>

  <main id="main" style="display:grid;gap:36px"></main>
</div>

"42", "line": "R3", "a": "冢貴", "b": "［最？］貴", "j": "冣貴", "conf": "中", "why": "冖の下に取。冣は最の異体"}, {"id": "k42-308", "r": "30-44", "page": "42", "line": "L2", "a": "撰集之", "b": "撰集〔注：之イ〕", "j": "撰集〔注：之イ〕", "conf": "中", "why": "「之」は小字で「イ」と並ぶ異本注記"}, {"id": "k42-309", "r": "30-44", "page": "42", "line": "L5", "a": "尋致", "b": "專致", "j": "專", "conf": "中", "why": "叀＋寸"}, {"id": "k43-310", "r": "30-44", "page": "43", "line": "R1", "a": "雅晴", "b": "雜晴", "j": "雜晴", "conf": "中", "why": "偏の下部に木状の画があり雜の形。人名としては雅晴の誤写の可能性"}, {"id": "k43-311", "r": "30-44", "page": "43", "line": "R2", "a": "〔注：喜慶［元？］〕丁卯", "b": "丁卯〔注：喜慶々〕", "j": "〔注：喜慶［元？］〕丁卯", "conf": "低", "why": "三字目は元の草体とも踊り字とも見える。嘉慶元年が丁卯"}, {"id": "k43-312", "r": "30-44", "page": "43", "line": "R4", "a": "于時", "b": "干時", "j": "干", "conf": "中", "why": "縦画に鉤がない"}, {"id": "k43-313", "r": "30-44", "page": "43", "line": "R4", "a": "戊〔注：戊〕戌", "b": "戊戌", "j": "戊戌", "conf": "中", "why": "小字二字のみ"}, {"id": "k43-314", "r": "30-44", "page": "43", "line": "L3", "a": "氣之筆作", "b": "氣之［筆？］作", "j": "［筆？］", "conf": "低", "why": "上部が艹状で華にも見える"}, {"id": "k43-315", "r": "30-44", "page": "43", "line": "L4", "a": "爰迄代", "b": "爰近代", "j": "爰［近？］代", "conf": "低", "why": "辶＋帀状"}, {"id": "k43-316", "r": "30-44", "page": "43", "line": "L5", "a": "猶門宮", "b": "猶［内？］宮", "j": "猶门宮", "conf": "中", "why": "L2・L3の门と同形。文意は内宮"}, {"id": "k43-317", "r": "30-44", "page": "43", "line": "L6", "a": "郭秘", "b": "鄙秘", "j": "郭", "conf": "中", "why": "偏は享の形"}, {"id": "k43-318", "r": "30-44", "page": "43", "line": "L7", "a": "然欤", "b": "然欲", "j": "欤", "conf": "中", "why": "欠の左が与状。「然らしむるか」"}, {"id": "k44-319", "r": "30-44", "page": "44", "line": "R2", "a": "行加（末字なし）", "b": "行加［古？］", "j": "行加［？］", "conf": "低", "why": "加の下に薄くかすれた士・古状の字形。次行の「点」の一部ではない"}], "general": [{"id": "g0", "r": "00-14", "sec": "読みの違い以外で、見ていただきたい点", "text": "小字二字の左右並び書きの読む順：右の字から読む方針（「奈利」「爲利」「比支」「倍利」「奈留」など）で統一した。page_01 R6「平止介武」、page_02 L2「止爲」のように、右から読むと文意が通りにくい箇所は字の並びのまま入れた。"}, {"id": "g1", "r": "00-14", "sec": "読みの違い以外で、見ていただきたい点", "text": "「尓」と「介」：「介」に似た「尒」の字形は A の方針どおり「尓」と書き、「介」の字形がはっきりしたもの（page_01 R4・R6、page_02 L3・L5 など）だけ「介」とした。この区別でよいか。"}, {"id": "g2", "r": "00-14", "sec": "読みの違い以外で、見ていただきたい点", "text": "朱の頭注の位置：page_09 L7、page_10 R8、page_12 L3、page_13 L5、page_14 R4 は、A と B で頭注を置く行が違った。画像で朱の位置を確かめて行を決めた。page_12 の墨の頭注「…宮儀式帳云…」も、L5〜L6 の上にあるので L6 に移した。"}, {"id": "g3", "r": "00-14", "sec": "読みの違い以外で、見ていただきたい点", "text": "page_11 の「伎」：A は「依」、B は「佐」と読んだ字（R4〜R7 の六か所）を、同じ字形・傍訓「キ」・通行本「生比伎尓」から「伎」とした。R4・R5 は文意が取りにくく［伎？］とした。"}, {"id": "g4", "r": "00-14", "sec": "読みの違い以外で、見ていただきたい点", "text": "字体：画像で一字ずつは確かめていない字体の違い（參・隨・愼・隱・繼・狹・惠・來 など）は、A にならい旧字にそろえた。"}, {"id": "g5", "r": "15-29", "sec": "全体にかかること", "text": "「ヱ」形の小字を「弖」と読むこと（「支」の別体の可能性）。本範囲の A「止」・B「弖」の食い違いの大半がこの字。"}, {"id": "g6", "r": "15-29", "sec": "全体にかかること", "text": "左右に並ぶ小字を右→左に読むこと（第1節）。該当：p20 R1・R2・R3・R5・R8、p24 L8、p26 R4・L2・L4、p27 L3・L4、p28 R6・L3、p29 R2。"}, {"id": "g7", "r": "15-29", "sec": "全体にかかること", "text": "p17 R9 の重書の扱い（A・B とも本文に残した）。"}, {"id": "g8", "r": "15-29", "sec": "全体にかかること", "text": "p25（README で大成と校合済みとされる丁）で、書写本の字面が大成・現行サイトと違う点：R3「播主」（大成は幡主）、R4「千税」（現行サイト「千杭」）、R7「真鳥」、L1「彼神」（「祓神」）、L4「夜」「時」、L8「捧」など（page_25.md の注）。"}, {"id": "g9", "r": "30-44", "sec": "行の切れ目・読む順序の違い（全体にかかわるもの）", "text": "page_36・37・38：割注が一列を使い切って次の列に続くとき、A はその続きの列を前の行に含め（または割注の小列を一行と数え）、B は列ごとに行番号を付けた。画像の列に合わせて B の行取りを採った。このため、この三丁は A と行番号がずれる（各丁の注に記した）。page_36 の「是也」「坐」のような一、二字のはみ出しは、割注の第三列として割注の中に入れた。"}, {"id": "g10", "r": "30-44", "sec": "行の切れ目・読む順序の違い（全体にかかわるもの）", "text": "page_41 左丁：A は L5 を「宇治機殿是也〔注：一名礒宮〕」で終え、「磐余甕栗宮三年」を L6 の末に、「難波長」を L7 の末に回していた。画像では L5 の末に「磐余甕栗宮〔朱：清寧天皇〕三年」、L6 の末に「難波長〔朱：孝徳天皇〕」があり、B の行取りが正しい。右丁上欄の朱書も A は一行目を「垂仁天皇即位廿七年」と読んでいたが、画像は「天智天皇即位七年」で、「智」の右に異本注記「［垂？］仁イニ」がある。"}, {"id": "g11", "r": "30-44", "sec": "行の切れ目・読む順序の違い（全体にかかわるもの）", "text": "page_42：同じ列の上半と下半に「太神宮本紀下」が二度書かれている。A は二行に分けたが一行とした（B と同じ）。"}, {"id": "g12", "r": "30-44", "sec": "特に重要なもの", "text": "page_43 R1「雜晴」（A雅晴・B雜晴）：拡大すると一字目の偏の下部に「木」状の画があり「雜」の形で、「雅」の偏「牙」ではない。字面どおり「雜晴」としたが、人名としては「雅晴」の誤写の可能性がある。度会氏の系図での確認をお願いしたい。"}, {"id": "g13", "r": "30-44", "sec": "特に重要なもの", "text": "page_43 R2「喜慶［元？］」：「丁卯」の右上の小字。三字目は「元」の草体とも踊り字とも見える。嘉慶元年（1387）が丁卯にあたる。"}, {"id": "g14", "r": "30-44", "sec": "特に重要なもの", "text": "page_41 右丁頭注「天智〔注：［垂？］仁イニ〕天皇即位七年」：A の「垂仁天皇即位廿七年」は誤り。異本注記の「垂」は上端が切れていて確認できない。"}, {"id": "g15", "r": "30-44", "sec": "特に重要なもの", "text": "page_42 R3「冣貴」：校正メモ表C-C24・翻刻A の「冢貴」とは字形が違い、「冣」（最の異体）と読んだ。"}, {"id": "g16", "r": "30-44", "sec": "特に重要なもの", "text": "page_43 L5「猶门宮」：字形は「门」（門の略体）で、文意は「内宮」。大成・通行本との照合を。"}, {"id": "g17", "r": "30-44", "sec": "特に重要なもの", "text": "page_35 L6〜L7「形弓座」「劔座」：L6 の相殿神（天兒屋命・太玉命）に付くか、L7 の天手力男神・万幡豊秋津姫命に付くか、配置からは決めがたい。"}, {"id": "g18", "r": "30-44", "sec": "特に重要なもの", "text": "page_36 R2 延佳注「延佳按伊以下七字可有之仍補入」：朱で囲まれた「八十枉津日神也」がちょうど七字で、「伊」は「八」の誤写の可能性がある。"}, {"id": "g19", "r": "30-44", "sec": "大成と校合済みとされる丁（page_30・42〜44）について", "text": "README で「大成と校合して確定した読み」とされる丁も、書写本の字面を書いた。大成・校正メモと違う点は各丁の注の末尾「大成本との違い」にまとめた。"}, {"id": "g20", "r": "30-44", "sec": "大成と校合済みとされる丁（page_30・42〜44）について", "text": "page_30：R3「沼〔注：治イ〕」、R5「止由居」、L2「村」、L4「井原志」、L6「稱辭竟」など。"}, {"id": "g21", "r": "30-44", "sec": "大成と校合済みとされる丁（page_30・42〜44）について", "text": "page_42：R3「冣貴」、L1「書〔注：写イ〕之」、L2「撰集〔注：之イ〕」（本行に「之」なし）。"}, {"id": "g22", "r": "30-44", "sec": "大成と校合済みとされる丁（page_30・42〜44）について", "text": "page_43：R1「雜晴」、R4「干時」、L5「门宮」、L6「郭秘」。"}, {"id": "g23", "r": "30-44", "sec": "大成と校合済みとされる丁（page_30・42〜44）について", "text": "page_44：R2 末の読めない小字［？］、R5「门」。"}]}</script>
<script>
(function(){
const DATA = JSON.parse(document.getElementById('data').textContent);
const ITEMS = DATA.items, GEN = DATA.general;
const OPTS_ITEM = [['ok','判定でよい'],['a','A を採る'],['b','B を採る'],['x','別の読み（メモに）'],['hold','保留']];
const OPTS_GEN = [['ok','この方針でよい'],['x','直してほしい（メモに）'],['hold','保留']];
const decisions = {}; let db=null, canWrite=false;
const el=(t,a={},...c)=>{const e=document.createElement(t);for(const[k,v]of Object.entries(a)){if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else e.setAttribute(k,v)}for(const x of c)if(x)e.append(x);return e};
const imgUrl=n=>'https://nakatokojuku.jp/'+encodeURIComponent('倭姫命世記')+'/images/page_'+n+'.jpg';
const ch=id=>(decisions[id]&&decisions[id].choice)||null;
const pages=[...new Set(ITEMS.map(i=>i.page))].sort();

function card(it,isGen){
  const c=el('article',{class:'card'+(isGen?' gen':'')+(ch(it.id)?' done':'')});
  const m=el('div',{class:'meta'});
  if(isGen){ m.append(el('span',{class:'no',text:'全体の方針'}), el('span',{text:'page_'+it.r.replace('-','〜')+'の報告より'}), el('span',{text:it.sec})); }
  else { m.append(el('span',{class:'no',text:'page_'+it.page+' '+it.line}), el('span',{class:'chip'+(it.conf==='低'?' lo':''),text:'確信度 '+it.conf})); }
  c.append(m);
  if(isGen){ c.append(el('p',{class:'gtext',text:it.text})); }
  else{
    c.append(el('div',{class:'trio'},
      el('div',{},el('span',{class:'lbl',text:'翻刻A'}),el('span',{class:'txt',text:it.a})),
      el('div',{},el('span',{class:'lbl',text:'翻刻B'}),el('span',{class:'txt',text:it.b})),
      el('div',{class:'j'},el('span',{class:'lbl',text:'確定翻刻の判定'}),el('span',{class:'txt',text:it.j}))));
    if(it.why) c.append(el('p',{class:'why',text:'根拠：'+it.why}));
  }
  const box=el('div',{class:'choices',role:'group','aria-label':'判断'});
  for(const [k,t] of (isGen?OPTS_GEN:OPTS_ITEM)){
    const b=el('button',{type:'button','data-k':k,'aria-pressed':String(ch(it.id)===k),text:t});
    b.disabled=!canWrite;
    b.addEventListener('click',()=>save(it.id,{choice: ch(it.id)===k?null:k}));
    box.append(b);
  }
  c.append(box);
  const ta=el('textarea',{id:'note-'+it.id,placeholder:'メモ（別の読み、気づいたことなど。任意）','aria-label':'メモ'});
  ta.value=(decisions[it.id]&&decisions[it.id].note)||''; ta.disabled=!canWrite;
  ta.addEventListener('change',()=>save(it.id,{note:ta.value.trim()}));
  c.append(ta);
  return c;
}
function render(){
  const only=document.getElementById('onlyOpen').checked, openMid=document.getElementById('openMid').checked;
  const main=document.getElementById('main'), toc=document.getElementById('toc');
  main.replaceChildren(); toc.replaceChildren();
  // general
  const gsec=el('section',{class:'pg',id:'general'});
  gsec.append(el('div',{class:'pg-head'},el('h2',{text:'全体にかかる方針'}),el('span',{class:'sub',text:'読み方の約束や、大成との違いなど '+GEN.length+'件'})));
  const gs=GEN.filter(g=>!(only&&ch(g.id)));
  gs.forEach(g=>gsec.append(card(g,true)));
  if(!gs.length) gsec.append(el('p',{class:'empty',text:'すべて選び終わりました。'}));
  main.append(gsec);
  const gdone=GEN.filter(g=>ch(g.id)).length;
  toc.append(el('a',{href:'#general',class:gdone===GEN.length?'done':'',text:'方針 '+gdone+'/'+GEN.length}));
  for(const p of pages){
    const list=ITEMS.filter(i=>i.page===p), lo=list.filter(i=>i.conf==='低'), mid=list.filter(i=>i.conf==='中');
    const done=list.filter(i=>ch(i.id)).length;
    toc.append(el('a',{href:'#p'+p,class:done===list.length?'done':'',text:p+'　'+done+'/'+list.length}));
    const s=el('section',{class:'pg',id:'p'+p});
    s.append(el('div',{class:'pg-head'},el('h2',{text:'page_'+p}),el('span',{class:'sub',text:'低 '+lo.length+'件・中 '+mid.length+'件'}),el('a',{href:imgUrl(p),target:'_blank',rel:'noopener',text:'画像を開く'})));
    const los=lo.filter(i=>!(only&&ch(i.id)));
    los.forEach(i=>s.append(card(i,false)));
    if(mid.length){
      const mids=mid.filter(i=>!(only&&ch(i.id)));
      const d=el('details',{class:'mid'}); if(openMid) d.open=true;
      const sm=el('summary',{text:'確信度「中」 '+mid.length+'件（未選択 '+mid.filter(i=>!ch(i.id)).length+'件）'});
      d.append(sm);
      const bl=el('div',{style:'margin-bottom:10px'});
      const bb=el('button',{type:'button',class:'bulk',text:'未選択の「中」をまとめて「判定でよい」にする'});
      bb.disabled=!canWrite||!mid.some(i=>!ch(i.id));
      bb.addEventListener('click',()=>bulk(mid.filter(i=>!ch(i.id))));
      bl.append(bb); d.append(bl);
      const L=el('div',{class:'list'}); mids.forEach(i=>L.append(card(i,false))); d.append(L);
      if(!mids.length) L.append(el('p',{class:'empty',text:'すべて選び終わりました。'}));
      s.append(d);
    }
    if(!los.length && only && !mid.length) s.append(el('p',{class:'empty',text:'すべて選び終わりました。'}));
    main.append(s);
  }
  const all=GEN.concat(ITEMS), n=all.filter(i=>ch(i.id)).length;
  const c=document.getElementById('counts'); c.replaceChildren();
  c.append(el('span',{},el('b',{text:String(n)}),' / '+all.length+' 件を判断済み'));
  const lo=ITEMS.filter(i=>i.conf==='低'); c.append(el('span',{text:'うち確信度「低」 '+lo.filter(i=>ch(i.id)).length+' / '+lo.length}));
  c.append(el('span',{text:'全体の方針 '+gdone+' / '+GEN.length}));
  document.getElementById('bar').style.width=(n/all.length*100)+'%';
}
async function save(id,patch){
  if(!db) return;
  const cur=Object.assign({},decisions[id]||{},patch,{at:new Date().toISOString()});
  decisions[id]=cur; render();
  try{ await db.collection('decisions').doc(id).set(cur); setStatus('保存しました。','') }
  catch(e){ setStatus('保存できませんでした（'+(e&&e.code||'error')+'）。少し待ってからもう一度お選びください。','bad') }
}
async function bulk(list){
  if(!db||!list.length) return;
  const at=new Date().toISOString();
  list.forEach(i=>{decisions[i.id]=Object.assign({},decisions[i.id]||{},{choice:'ok',at})}); render();
  let bad=0;
  for(const i of list){ try{ await db.collection('decisions').doc(i.id).set(decisions[i.id]) }catch(e){ bad++ } }
  setStatus(bad?bad+'件を保存できませんでした。もう一度お試しください。':list.length+'件を保存しました。', bad?'bad':'');
}
function setStatus(t,cls){const s=document.getElementById('dbstatus');s.textContent=t;s.className='status '+(cls||'')}
for(const id of ['onlyOpen','openMid']){
  const box=document.getElementById(id);
  try{ if(localStorage.getItem(id)) box.checked=true }catch(e){}
  box.addEventListener('change',()=>{try{localStorage.setItem(id,box.checked?'1':'')}catch(e){};render()});
}
render();
(async()=>{
  const msg='保存先に接続できません。claude.ai にサインインした状態で開くと、選んだ内容が保存されます。';
  const timer=setTimeout(()=>setStatus(msg,'bad'),10000);
  try{
    db = window.claude ? await window.claude.use('db') : null;
    const user = window.claude ? await window.claude.use('user') : null;
    if(!db){clearTimeout(timer);setStatus(msg,'bad');return}
    canWrite = (user ? user.can('data.write') : null)!==false;
    db.collection('decisions').onSnapshot(snap=>{
      clearTimeout(timer);
      for(const d of snap.docs){ if(d.exists) decisions[d.id]=d.data() }
      for(const x of snap.docChanges()){ if(x.type==='removed') delete decisions[x.doc.id] }
      setStatus(canWrite?'選んだ内容はその場で保存されます。':'閲覧のみです（書き込みの権限がありません）。', canWrite?'':'bad');
      render();
    },e=>{clearTimeout(timer);setStatus('保存先を読み込めませんでした（'+e.code+'）。','bad')});
  }catch(e){clearTimeout(timer);setStatus('保存先に接続できませんでした。','bad')}
})();
})();
</script>
